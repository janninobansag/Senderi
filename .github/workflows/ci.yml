name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Client and server quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Type-check client
        run: npm run typecheck
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Lint server
        run: npm run lint
        working-directory: server

      - name: Type-check server and shared contracts
        run: npm run typecheck
        working-directory: server

      - name: Build server
        run: npm run build
        working-directory: server

      - name: Test server
        run: npm test
        working-directory: server
